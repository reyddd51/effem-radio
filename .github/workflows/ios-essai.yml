# Fabrication d'essai de l'app iPhone, SANS signature Apple : vérifie seulement que le projet se construit.
# Ne s'installe pas sur un téléphone. Se lance à la main (onglet « Actions » › « App iPhone, fabrication d'essai »).
name: App iPhone, fabrication d'essai

on:
  workflow_dispatch:

jobs:
  essai:
    runs-on: macos-15-intel   # les Mac arm64 de GitHub manquent souvent de place
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version web à jour
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 source/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Projet natif à jour
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          node copy-web.js
          npx cap sync ios

      - name: Fabrication sans signature
        working-directory: app/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
