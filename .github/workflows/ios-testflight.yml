# Fabrique l'app iPhone d'Effem sur un Mac de GitHub et l'envoie sur TestFlight.
# Se lance à la main (onglet « Actions » › « App iPhone vers TestFlight » › « Run workflow »).
# Secrets à créer dans GitHub (Settings › Secrets and variables › Actions) :
#   APPLE_TEAM_ID          identifiant d'équipe Apple (10 caractères)
#   ASC_KEY_ID             identifiant de la clé App Store Connect
#   ASC_ISSUER_ID          identifiant de l'émetteur (Issuer ID)
#   ASC_KEY_P8             contenu complet du fichier AuthKey_XXXX.p8
name: App iPhone vers TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15-intel   # les Mac arm64 de GitHub manquent souvent de place
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Version web à jour
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 source/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Projet natif à jour
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          node copy-web.js
          npx cap sync ios

      - name: Vérification des 4 codes Apple
        env:
          A: ${{ secrets.APPLE_TEAM_ID }}
          B: ${{ secrets.ASC_KEY_ID }}
          C: ${{ secrets.ASC_ISSUER_ID }}
          D: ${{ secrets.ASC_KEY_P8 }}
        run: |
          manque=""
          [ -n "$A" ] || manque="$manque APPLE_TEAM_ID"
          [ -n "$B" ] || manque="$manque ASC_KEY_ID"
          [ -n "$C" ] || manque="$manque ASC_ISSUER_ID"
          [ -n "$D" ] || manque="$manque ASC_KEY_P8"
          if [ -n "$manque" ]; then echo "::error::Codes introuvables :$manque (Settings › Secrets and variables › Actions › onglet Secrets › Repository secrets)"; exit 1; fi
          echo "Les 4 codes sont bien là."

      - name: Clé App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Fabrication (archive)
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Xcode le plus récent installé sur le Mac (Apple exige le SDK iOS le plus récent pour l'App Store)
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1); echo "Xcode choisi : $X"; sudo xcode-select -s "$X"; xcodebuild -version
          # Archive sans signature : c'est l'envoi (étape suivante) qui signe pour l'App Store, avec la clé d'App Store Connect.
          # (Sinon Xcode réclame un profil de développement, impossible sans iPhone enregistré.)
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Effem.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Envoi sur TestFlight
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Effem.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      # Les builds envoyés hors de Xcode Cloud ne vont pas tout seuls aux testeurs internes :
      # on attend qu'Apple ait fini de préparer le build, puis on l'ajoute à chaque groupe de tests internes (« Équipe »).
      - name: Ajout aux testeurs internes
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APP_ID: "6825839731"
        run: |
          python3 -m pip install --quiet "pyjwt[crypto]" requests || python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" requests
          python3 - <<'PY'
          import os, time, jwt, requests
          key = open(f"{os.environ['RUNNER_TEMP']}/keys/AuthKey_{os.environ['KEY_ID']}.p8").read()
          def h():
              t = int(time.time())
              tok = jwt.encode({"iss": os.environ["ISSUER"], "iat": t, "exp": t + 1100, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"]})
              return {"Authorization": f"Bearer {tok}"}
          api = "https://api.appstoreconnect.apple.com/v1"
          app, num = os.environ["APP_ID"], os.environ["GITHUB_RUN_NUMBER"]
          build = None
          for i in range(70):   # jusqu'à 35 minutes
              r = requests.get(f"{api}/builds", headers=h(), params={"filter[app]": app, "filter[version]": num, "limit": 1}).json()
              d = r.get("data") or []
              state = d[0]["attributes"].get("processingState") if d else "pas encore visible"
              print(f"Build {num} : {state}")
              if state == "VALID": build = d[0]["id"]; break
              if state in ("FAILED", "INVALID"): raise SystemExit(f"Apple a refusé le build : {state}")
              time.sleep(30)
          if not build: raise SystemExit("Build pas prêt à temps : l'ajouter à la main dans App Store Connect › TestFlight › Équipe › Builds.")
          groups = requests.get(f"{api}/apps/{app}/betaGroups", headers=h(), params={"limit": 50}).json().get("data", [])
          for g in groups:
              if g["attributes"].get("isInternalGroup"):
                  r = requests.post(f"{api}/betaGroups/{g['id']}/relationships/builds", headers=h(), json={"data": [{"type": "builds", "id": build}]})
                  print(f"Groupe « {g['attributes'].get('name')} » : {'ajouté' if r.status_code in (200, 204) else r.text}")
          PY
