# Fabrique l'app Android d'Effem sur un ordinateur de GitHub.
# Se lance à la main (onglet « Actions » › « App Android » › « Run workflow »).
#
# Sans les secrets ci-dessous : fabrique seulement une version d'essai (effem-essai.apk) à installer sur un téléphone Android.
# Avec les secrets : fabrique aussi le paquet signé pour Google Play (effem-google-play.aab).
# Secrets à créer dans GitHub (Settings › Secrets and variables › Actions) — Johanna les saisit elle-même :
#   ANDROID_KEYSTORE_B64       le fichier de clé de signature (effem-upload.jks) converti en base64
#   ANDROID_KEYSTORE_PASSWORD  mot de passe du fichier de clé
#   ANDROID_KEY_ALIAS          nom de la clé (effem)
#   ANDROID_KEY_PASSWORD       mot de passe de la clé
name: App Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version web à jour
        run: |
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 source/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Projet natif à jour
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          node copy-web.js
          npx cap sync android

      - name: Version d'essai (APK)
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Clé de signature
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/effem-upload.jks"
            echo "path=$RUNNER_TEMP/effem-upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "Pas de clé de signature : seule la version d'essai est fabriquée."
          fi

      - name: Paquet Google Play (AAB signé)
        if: steps.key.outputs.path != ''
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Fichiers à télécharger
        run: |
          mkdir -p sortie
          cp app/android/app/build/outputs/apk/debug/app-debug.apk sortie/effem-essai.apk
          if [ -f app/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/android/app/build/outputs/bundle/release/app-release.aab sortie/effem-google-play.aab
          fi
          rm -f "$RUNNER_TEMP/effem-upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: effem-android
          path: sortie/
